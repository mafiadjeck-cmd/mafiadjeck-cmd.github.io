<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практикум</title></head>
<body>
<div id="loading" role="status" style="font:16px Arial,sans-serif;padding:28px">Загрузка сайта «Практикум»…</div>
<noscript>Для просмотра сайта включите JavaScript или <a href="base.html">откройте резервную версию</a>.</noscript>
<script>
(async()=>{
  try{
    let html;
    const timeoutController=new AbortController();
    const timeoutId=setTimeout(()=>timeoutController.abort(),4000);
    try{
      const r=await fetch('https://praktikum-cms-api.onrender.com/site?ts='+Date.now(),{cache:'no-store',signal:timeoutController.signal});
      if(!r.ok) throw new Error('CMS '+r.status);
      html=await r.text();
    }catch(e){
      const r=await fetch('base.html?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw e;
      html=await r.text();
    }finally{clearTimeout(timeoutId)}
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div style="font:16px Arial;padding:30px">Не удалось загрузить сайт. <a href="base.html">Открыть резервную версию</a>.</div>';
    console.error(e);
  }
})();
</script>
</body></html>
