name: Restore exact Praktikum source

on:
  push:
    paths:
      - '.github/workflows/restore-praktikum-exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download exact uploaded source
        run: |
          curl -L --fail 'https://eu-central.storage.cloudconvert.com/tasks/08b48ea4-9b36-460c-bf0c-7f4c5eff08ba/%D0%92%D1%81%D1%82%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9%20%D1%82%D0%B5%D0%BA%D1%81%D1%82.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260916%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260916T150457Z&X-Amz-Expires=86400&X-Amz-Signature=fbb77a73eebed3fdbbd9320b9b2d3f58836a1fb39363801e36ccf20791170ce7&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22%3F%3F%3F%3F%3F%3F%3F%3F%3F%3F%3F%20%3F%3F%3F%3F%3F.zip%22%3B%20filename%2A%3DUTF-8%27%27%25D0%2592%25D1%2581%25D1%2582%25D0%25B0%25D0%25B2%25D0%25BB%25D0%25B5%25D0%25BD%25D0%25BD%25D1%258B%25D0%25B9%2520%25D1%2582%25D0%25B5%25D0%25BA%25D1%2581%25D1%2582.zip&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject' -o /tmp/praktikum.zip
          mkdir -p praktikum-demo
          unzip -p /tmp/praktikum.zip > praktikum-demo/index.html
          test -s praktikum-demo/index.html
          grep -q 'Бухучёт, 1С и налоги с нуля за 1,5 месяца' praktikum-demo/index.html
          grep -q 'data-content-key="text-001"' praktikum-demo/index.html
      - name: Commit exact page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add praktikum-demo/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Publish exact Praktikum source from uploaded file'
            git push
          fi
