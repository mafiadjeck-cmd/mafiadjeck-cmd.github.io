name: Praktikum isolated Redis restore integration
on:
  push:
    branches:
      - staging/praktikum-safe-2026-10-30
    paths:
      - 'praktikum-cms-server/server.js'
      - 'praktikum-cms-server/tests/integration-redis.cjs'
      - '.github/workflows/praktikum-isolated-redis-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: redis-7.4
            image: redis:7.4-alpine
            health_cli: redis-cli
          - engine: valkey-8.1.10
            image: valkey/valkey:8.1.10-alpine
            health_cli: valkey-cli
    timeout-minutes: 8
    services:
      disposable_redis:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.health_cli }} ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      INTEGRATION_REDIS_BASE: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only current staged server dependencies
        run: cd praktikum-cms-server && npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax validation
        run: |
          node --check praktikum-cms-server/server.js
          node --check praktikum-cms-server/tests/integration-redis.cjs
      - name: Integration test against disposable Redis DB14 and DB15
        shell: bash
        run: |
          set -Eeuo pipefail
          cd praktikum-cms-server
          node tests/integration-redis.cjs | tee isolated-integration-result.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: praktikum-isolated-restore-${{ matrix.engine }}
          path: praktikum-cms-server/isolated-integration-result.log
          if-no-files-found: error
          retention-days: 7
