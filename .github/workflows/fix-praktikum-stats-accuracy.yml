name: Fix Praktikum stats accuracy
on:
  push:
    paths:
      - '.github/workflows/fix-praktikum-stats-accuracy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_praktikum_stats_accuracy.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add praktikum-cms-server/server.js
          git commit -m "Fix Praktikum statistics ranges and Bishkek dates"
          git push
