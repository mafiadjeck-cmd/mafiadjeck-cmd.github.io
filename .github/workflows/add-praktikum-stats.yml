name: Add Praktikum stats
on:
  push:
    paths:
      - '.github/workflows/add-praktikum-stats.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_praktikum_stats.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add praktikum-demo/admin/index.html
          git commit -m "Add statistics dashboard to Praktikum admin"
          git push
