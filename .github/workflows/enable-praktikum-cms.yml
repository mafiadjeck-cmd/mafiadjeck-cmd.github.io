name: Enable Praktikum CMS

on:
  push:
    paths:
      - '.github/workflows/enable-praktikum-cms.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact site and enable CMS
        run: |
          cp praktikum-demo/index.html praktikum-demo/base.html
          cat > praktikum-demo/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практикум</title></head>
          <body>
          <script>
          (async()=>{
            try{
              let html;
              try{
                const r=await fetch('https://praktikum-cms-api.onrender.com/site?ts='+Date.now(),{cache:'no-store'});
                if(!r.ok) throw new Error('CMS '+r.status);
                html=await r.text();
              }catch(e){
                const r=await fetch('base.html?ts='+Date.now(),{cache:'no-store'});
                if(!r.ok) throw e;
                html=await r.text();
              }
              document.open();document.write(html);document.close();
            }catch(e){
              document.body.innerHTML='<div style="font:16px Arial;padding:30px">Ошибка загрузки сайта. Обновите страницу.</div>';
              console.error(e);
            }
          })();
          </script>
          </body></html>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('praktikum-demo/admin/index.html')
          s=p.read_text(encoding='utf-8')
          old_note='<div class="content"><div class="note">Сайт на GitHub оставлен без изменений. Эта админка читает именно его, позволяет менять данные, смотреть предпросмотр и собирать новый HTML. Публикацию на GitHub для всех посетителей подключим отдельным защищённым сервером — без токена в браузере.</div>'
          if old_note not in s: raise SystemExit('notice not found')
          s=s.replace(old_note,'<div class="content">',1)
          s=s.replace('Редактор работает поверх текущего HTML.<br>Исходный публичный сайт сам по себе не меняется.','Практикум CMS · управление опубликованной версией',1)
          s=s.replace('Можно заменить встроенные изображения только в черновике/экспорте. Публичный исходник не меняется.','Можно заменить встроенные изображения и опубликовать изменения на сайте.',1)
          old_btn='<button class="btn red" id="downloadBtn">Скачать HTML</button>'
          if old_btn not in s: raise SystemExit('button not found')
          s=s.replace(old_btn,'<button class="btn red" id="publishBtn">Опубликовать</button>',1)
          old_const="const K='praktikum-admin-draft-v2',H='praktikum-admin-history-v2';"
          if old_const not in s: raise SystemExit('const not found')
          s=s.replace(old_const,old_const+"\nconst API='https://praktikum-cms-api.onrender.com';",1)
          marker='async function init(){try{const r=await fetch(\'../index.html?admin=\'+Date.now(),{cache:\'no-store\'});if(!r.ok)throw new Error(\'HTTP \'+r.status);original=await r.text();baseDoc='
          repl="async function init(){try{try{const r=await fetch(API+'/site?admin='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);original=await r.text()}catch(_){const r=await fetch('../base.html?admin='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);original=await r.text()}baseDoc="
          if marker not in s: raise SystemExit('init marker not found')
          s=s.replace(marker,repl,1)
          insert="""async function publish(){syncCourse();let key=sessionStorage.getItem('praktikum-publish-key');if(!key){key=prompt('Введите пароль админки');if(!key)return}const b=$('publishBtn'),old=b.textContent;b.disabled=true;b.textContent='Публикую…';try{const html=buildHtml();const r=await fetch(API+'/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({html})});if(r.status===401){sessionStorage.removeItem('praktikum-publish-key');throw new Error('Неверный пароль админки')}if(!r.ok){let m='Ошибка публикации';try{const j=await r.json();m=j.error||m}catch{}throw new Error(m)}sessionStorage.setItem('praktikum-publish-key',key);snapshot('Опубликовано');toast('Сайт опубликован');setTimeout(()=>window.open('../?v='+Date.now(),'_blank'),500)}catch(e){toast(e.message||'Ошибка публикации')}finally{b.disabled=false;b.textContent=old}}\n"""
          init_marker='async function init(){try{'
          s=s.replace(init_marker,insert+init_marker,1)
          bind="$('downloadBtn').onclick=download;"
          if bind not in s: raise SystemExit('bind not found')
          s=s.replace(bind,"$('publishBtn').onclick=publish;",1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/enable-praktikum-cms.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add praktikum-demo/index.html praktikum-demo/base.html praktikum-demo/admin/index.html .github/workflows/enable-praktikum-cms.yml
          git commit -m "Enable working Praktikum CMS publishing"
          git push
